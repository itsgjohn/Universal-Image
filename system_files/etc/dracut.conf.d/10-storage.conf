# The image is built in a container, so dracut cannot auto-detect the
# storage controller of the machine that will boot it. Keep host-only
# modules for size, but force the common boot-time storage drivers and
# filesystems into every initramfs.
hostonly="yes"
add_drivers+=" btrfs ahci libahci libata sd_mod sr_mod uas "
filesystems+=" btrfs ext4 xfs vfat "
