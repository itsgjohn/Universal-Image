name: Build container image
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '05 10 * * *'  # 10:05am UTC everyday
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:
 
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
 
jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-26.04
 
    permissions:
      contents: read
      packages: write
      id-token: write
 
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
 
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
 
      - name: Prepare environment
        run: |
          # Image name = ghcr.io/<owner>/<repo>, lowercased (GHCR requires lowercase)
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "${GITHUB_ENV}"
          echo "DATE=$(date -u +%Y%m%d)" >> "${GITHUB_ENV}"
          echo "SHA=$(git rev-parse --short HEAD)" >> "${GITHUB_ENV}"
 
      - name: Lint build scripts
        run: |
          find . -iname "*.sh" -type f -exec shellcheck {} +
 
      - name: Build image
        run: |
          podman build \
            --pull=newer \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:${DATE}" \
            --tag "${IMAGE}:${DATE}-${SHA}" \
            --file Containerfile .
 
      # Pull requests build only; nothing below runs for them
      - name: Login to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Push to GHCR
        id: push-image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          set -euox pipefail
          for tag in latest "${DATE}" "${DATE}-${SHA}"; do
            podman push --digestfile=/tmp/digestfile "${IMAGE}:${tag}"
          done
          echo "digest=$(< /tmp/digestfile)" >> "${GITHUB_OUTPUT}"
